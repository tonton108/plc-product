# Flask中央サーバー用ログローテーション設定
#
# インストール方法:
#   sudo cp backend/logrotate.conf /etc/logrotate.d/plc_dashboard
#   sudo chmod 644 /etc/logrotate.d/plc_dashboard
#
# 手動実行（テスト）:
#   sudo logrotate -f /etc/logrotate.d/plc_dashboard
#

# Flaskアプリケーションログ
/var/log/plc_dashboard/flask.log {
    # 日次ローテーション
    daily

    # 30日分のログを保持
    rotate 30

    # 空のログファイルはローテーションしない
    notifempty

    # ログファイルが存在しなくてもエラーにしない
    missingok

    # gzip圧縮を有効化
    compress

    # 最新のログファイルは圧縮しない
    delaycompress

    # ローテーション後に新しいログファイルを作成
    create 0644 www-data www-data

    # 日付サフィックスを追加
    dateext
    dateformat -%Y%m%d

    # ローテーション前にプロセスにSIGHUPシグナルを送信
    sharedscripts
    postrotate
        # Flaskアプリがsystemdで管理されている場合
        systemctl reload plc_dashboard.service > /dev/null 2>&1 || true
        # または、Docker Composeの場合
        # docker-compose -f /path/to/docker-compose.yml restart backend > /dev/null 2>&1 || true
    endscript
}

# PostgreSQLログ（オプション）
/var/log/postgresql/postgresql-*.log {
    weekly
    rotate 4
    notifempty
    missingok
    compress
    delaycompress
    create 0640 postgres postgres
    sharedscripts
    postrotate
        /usr/bin/pg_ctl reload -D /var/lib/postgresql/data > /dev/null 2>&1 || true
    endscript
}

# Nginxアクセスログ（リバースプロキシを使用している場合）
/var/log/nginx/plc_dashboard_access.log {
    daily
    rotate 14
    notifempty
    missingok
    compress
    delaycompress
    create 0644 www-data www-data
    sharedscripts
    postrotate
        nginx -s reload > /dev/null 2>&1 || true
    endscript
}

# Nginxエラーログ
/var/log/nginx/plc_dashboard_error.log {
    daily
    rotate 30
    notifempty
    missingok
    compress
    delaycompress
    create 0644 www-data www-data
    sharedscripts
    postrotate
        nginx -s reload > /dev/null 2>&1 || true
    endscript
}
