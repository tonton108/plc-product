{% extends "base.html" %}
{% block title %}初期設定{% endblock %}

{% block content %}
<div class="container">
  <div class="monitor-card">
    <h2>🚀 初期設定</h2>
    
    {% if error %}
    <div style="background-color: #ffebee; border: 1px solid #f44336; border-radius: 4px; padding: 12px; margin-bottom: 16px; color: #c62828;">
      <strong>❌ エラー:</strong> {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div style="background-color: #e8f5e8; border: 1px solid #4caf50; border-radius: 4px; padding: 12px; margin-bottom: 16px; color: #2e7d32;">
      <strong>✅ 成功:</strong> {{ success }}
    </div>
    {% endif %}

    <form method="post" class="form-grid">
      <!-- 基本設定セクション -->
      <div class="form-section">
        <h3 style="color: var(--primary); margin-bottom: 16px;">🏭 基本設定</h3>
        
        <div class="basic-config-grid">
          <div class="form-group">
            <label><strong>設備ID:</strong></label>
            <input type="text" name="equipment_id" value="{{ equipment.equipment_id or '' }}" required>
          </div>

          <div class="form-group">
            <label><strong>PLCメーカー:</strong></label>
            <select name="manufacturer" id="manufacturer" required>
              {% for m in manufacturers %}
                <option value="{{ m }}" {% if equipment.manufacturer == m %}selected{% endif %}>{{ m }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label><strong>シリーズ:</strong></label>
            <select name="series" id="series" required>
              {% for s in series_list.get(equipment.manufacturer or '', []) %}
                <option value="{{ s }}" {% if equipment.series == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label><strong>🎯 PLC IPアドレス:</strong></label>
            <input type="text" name="plc_ip" value="{{ equipment.plc_ip or '192.168.1.100' }}" 
                   placeholder="例: 192.168.1.100" required>
          </div>

          <div class="form-group">
            <label><strong>PLCポート:</strong></label>
            <input type="number" name="plc_port" value="{{ equipment.plc_port or 5000 }}" required>
          </div>

          <div class="form-group">
            <label><strong>🌐 中央サーバーIP:</strong></label>
            <input type="text" name="central_server_ip" value="{{ equipment.central_server_ip or '192.168.1.10' }}" 
                   placeholder="例: 192.168.1.10" required>
          </div>

          <div class="form-group">
            <label><strong>中央サーバーポート:</strong></label>
            <input type="number" name="central_server_port" value="{{ equipment.central_server_port or 5000 }}" required>
          </div>

          <div class="form-group">
            <label><strong>取得間隔 (ms):</strong></label>
            <input type="number" name="interval" value="{{ equipment.interval or 1000 }}" required>
          </div>

          <div class="form-group">
            <label><strong>🔌 Modbusポート:</strong> <small style="color: #666;">※キーエンスPLC使用時のみ必要</small></label>
            <input type="number" name="modbus_port" value="{{ equipment.modbus_port or 502 }}" 
                   placeholder="キーエンス用 (デフォルト: 502)">
          </div>
        </div>
      </div>

      <!-- PLCアドレス設定セクション -->
      <div class="form-section">
        <h3 style="color: var(--primary); margin: 20px 0 16px 0;">📍 PLCデータ項目設定</h3>

        <div class="data-config-section">
          <div id="plc-items-container" class="plc-items-container">
            <!-- 項目が動的に追加される -->
          </div>

          <button type="button" onclick="addPLCItem()" class="btn secondary" style="margin-top: 12px;">
            ➕ 項目を追加
          </button>

          <!-- PLC設定をJSON形式でhidden inputとして送信 -->
          <input type="hidden" name="plc_configs_json" id="plc_configs_json">
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn primary">💾 設定完了</button>
      </div>
    </form>
  </div>
</div>

<style>
/* PLC項目カードのスタイル（monitoring.htmlと同じ）*/
.plc-items-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.plc-item-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(0, 0, 0, 0.1);
  border-radius: 8px;
  padding: 16px;
}

body.dark .plc-item-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.plc-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.1);
}

body.dark .plc-item-header {
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.plc-item-number {
  font-size: 14px;
  font-weight: bold;
  color: var(--primary);
}

.btn-remove {
  background: #f44336;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s;
}

.btn-remove:hover {
  background: #d32f2f;
}

.plc-item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}

.plc-item-grid .form-group {
  margin-bottom: 0;
}

.plc-item-grid label {
  display: block;
  margin-bottom: 4px;
  font-size: 13px;
}

.plc-item-grid input,
.plc-item-grid select {
  width: 100%;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 14px;
}

body.dark .plc-item-grid input,
body.dark .plc-item-grid select {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--text);
}
</style>

<script type="application/json" id="series-data">{{ series_list | tojson | safe }}</script>
<script type="application/json" id="current-series">"{{ equipment.series or '' }}"</script>

<script>
  // PLC項目管理用の配列
  let plcItems = [];
  let nextItemId = 0;

  // PLC項目を追加
  function addPLCItem(data = null) {
    const itemId = nextItemId++;
    const item = data || {
      id: itemId,
      data_type: `item_${itemId}`,
      name: '',
      icon: '',
      unit: '',
      enabled: true,
      address: '',
      scale_factor: 1,
      plc_data_type: 'word'
    };
    item.id = itemId;

    plcItems.push(item);
    renderPLCItems();
  }

  // PLC項目を削除
  function removePLCItem(itemId) {
    plcItems = plcItems.filter(item => item.id !== itemId);
    renderPLCItems();
  }

  // PLC項目一覧を描画
  function renderPLCItems() {
    const container = document.getElementById('plc-items-container');
    container.innerHTML = '';

    plcItems.forEach((item, index) => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'plc-item-card';
      itemDiv.innerHTML = `
        <div class="plc-item-header">
          <span class="plc-item-number">#${index + 1}</span>
          <button type="button" onclick="removePLCItem(${item.id})" class="btn-remove" title="削除">🗑️</button>
        </div>

        <div class="plc-item-grid">
          <div class="form-group">
            <label><strong>項目名:</strong></label>
            <input type="text" data-item-id="${item.id}" data-field="name" value="${item.name || ''}"
                   placeholder="例: 金型温度A" required>
          </div>

          <div class="form-group">
            <label><strong>アイコン:</strong></label>
            <input type="text" data-item-id="${item.id}" data-field="icon" value="${item.icon || ''}"
                   placeholder="🌡️" maxlength="10">
          </div>

          <div class="form-group">
            <label><strong>単位:</strong></label>
            <input type="text" data-item-id="${item.id}" data-field="unit" value="${item.unit || ''}"
                   placeholder="例: ℃" maxlength="20">
          </div>

          <div class="form-group">
            <label><strong>PLCアドレス:</strong></label>
            <input type="text" data-item-id="${item.id}" data-field="address" value="${item.address || ''}"
                   placeholder="D100" required>
          </div>

          <div class="form-group">
            <label><strong>データ型:</strong></label>
            <select data-item-id="${item.id}" data-field="plc_data_type">
              <option value="word" ${item.plc_data_type === 'word' ? 'selected' : ''}>Word (16bit)</option>
              <option value="dword" ${item.plc_data_type === 'dword' ? 'selected' : ''}>DWord (32bit)</option>
              <option value="float32" ${item.plc_data_type === 'float32' ? 'selected' : ''}>Float32</option>
              <option value="bit" ${item.plc_data_type === 'bit' ? 'selected' : ''}>Bit</option>
            </select>
          </div>

          <div class="form-group">
            <label><strong>倍率:</strong></label>
            <input type="number" data-item-id="${item.id}" data-field="scale_factor" value="${item.scale_factor || 1}"
                   min="1" required>
          </div>
        </div>
      `;

      container.appendChild(itemDiv);
    });

    // イベントリスナーを設定
    container.querySelectorAll('input, select').forEach(input => {
      input.addEventListener('change', function() {
        const itemId = parseInt(this.getAttribute('data-item-id'));
        const field = this.getAttribute('data-field');
        const item = plcItems.find(i => i.id === itemId);
        if (item) {
          if (field === 'scale_factor') {
            item[field] = parseInt(this.value);
          } else {
            item[field] = this.value;
          }
        }
      });
    });
  }

  // PLCメーカー変更時のシリーズ更新
  document.addEventListener('DOMContentLoaded', function() {
    updateModbusPortState();
    // 初期項目を追加
    addPLCItem();
  });

  function updateModbusPortState() {
    const manufacturerSelect = document.getElementById('manufacturer');
    const seriesSelect = document.getElementById('series');
    const series_data = JSON.parse(document.getElementById('series-data').textContent);
    const currentSeries = JSON.parse(document.getElementById('current-series').textContent);

    function updateSeries() {
      const manufacturer = manufacturerSelect.value;
      seriesSelect.innerHTML = '';

      if (series_data[manufacturer]) {
        series_data[manufacturer].forEach(function(series) {
          const option = document.createElement('option');
          option.value = series;
          option.textContent = series;
          if (series === currentSeries) {
            option.selected = true;
          }
          seriesSelect.appendChild(option);
        });
      }
    }

    manufacturerSelect.addEventListener('change', updateSeries);
    updateSeries();
  }

  // フォーム送信時にPLC設定をJSON形式でhidden inputに格納
  document.querySelector('form').addEventListener('submit', function(e) {
    const plcConfigs = plcItems.map(item => ({
      data_type: item.data_type,
      name: item.name,
      icon: item.icon,
      unit: item.unit,
      enabled: true,
      address: item.address,
      scale_factor: item.scale_factor,
      plc_data_type: item.plc_data_type
    }));

    document.getElementById('plc_configs_json').value = JSON.stringify(plcConfigs);
    console.log('📡 送信するPLC設定:', plcConfigs);
  });
</script>
{% endblock %}
