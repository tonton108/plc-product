[pytest]
# pytestの設定ファイル

# テストディレクトリ
testpaths = tests

# Pythonファイルのパターン
python_files = test_*.py

# テストクラスのパターン
python_classes = Test*

# テスト関数のパターン
python_functions = test_*

# 出力オプション
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# マーカー定義
markers =
    unit: ユニットテスト（高速、外部依存なし）
    integration: 統合テスト（外部依存あり）
    slow: 実行時間が長いテスト
    requires_plc: 実際のPLC接続が必要なテスト
