services:
  # PostgreSQLデータベース（共通）
  db:
    image: postgres:15-alpine
    container_name: plc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-plc_monitor}
      PGCLIENTENCODING: utf-8
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # ホストのPostgreSQLと競合を避けるため5433に変更
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plc-network
    restart: unless-stopped

  # Redis（Socket.IOのmessage_queue用・Phase 4 ingest分離）
  # 本番は serve_production.py を ingest/viewer の2プロセスで起動し、
  # SOCKETIO_MESSAGE_QUEUE=redis://redis:6379/0 を共有して配信を橋渡しする。
  # 開発の単一プロセス（flask run）では未使用でも動く。
  redis:
    image: redis:7-alpine
    container_name: plc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - plc-network
    restart: unless-stopped

  # Flaskバックエンド（中央サーバーモード）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plc-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-plc_user}:${POSTGRES_PASSWORD:-plc_pass}@db:5432/${POSTGRES_DB:-plc_monitor}
      FLASK_APP: manage.py
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-secret-key}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - plc-network
    restart: unless-stopped
    command: flask run --host=0.0.0.0 --port=5000

  # Nuxt.jsフロントエンド
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: plc-frontend
    environment:
      NODE_ENV: development
      # ブラウザからアクセスするのでlocalhostを使用
      NUXT_PUBLIC_API_BASE: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - plc-network
    restart: unless-stopped

  # Raspberry Piエージェント（開発環境用）
  raspi-agent:
    build:
      context: ./raspi_agent
      dockerfile: Dockerfile.agent
    container_name: plc-raspi-agent
    environment:
      USE_DUMMY_PLC: ${USE_DUMMY_PLC:-true}
      CENTRAL_SERVER_IP: ${CENTRAL_SERVER_IP:-backend}
      CENTRAL_SERVER_PORT: ${CENTRAL_SERVER_PORT:-5000}
      RASPI_UI_PORT: ${RASPI_UI_PORT:-5001}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      SECRET_KEY: ${SECRET_KEY:-development-secret-key}
    ports:
      - "5001:5001"
    depends_on:
      - backend
    networks:
      - plc-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  plc-network:
    driver: bridge
