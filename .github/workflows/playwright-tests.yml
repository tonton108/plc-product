name: Playwright Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: plc_user
          POSTGRES_PASSWORD: plc_pass
          POSTGRES_DB: plc_monitor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'plc-dashboard/backend/requirements.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'plc-dashboard/package-lock.json'

      - name: Install Python dependencies
        run: |
          cd plc-dashboard/backend
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          pip install playwright pytest-playwright
          playwright install chromium
          playwright install-deps

      - name: Install Node.js dependencies
        run: |
          cd plc-dashboard
          npm ci

      - name: Setup environment variables
        run: |
          cd plc-dashboard
          cp .env.example .env
          echo "DATABASE_URL=postgresql+psycopg2://plc_user:plc_pass@localhost:5432/plc_monitor" >> .env

      - name: Initialize database
        run: |
          cd plc-dashboard
          export PYTHONPATH="${PWD}/backend:${PYTHONPATH}"
          cd backend
          flask --app manage.py db upgrade
        env:
          DATABASE_URL: postgresql+psycopg2://plc_user:plc_pass@localhost:5432/plc_monitor

      - name: Seed auth (admin user + agent API key)
        run: |
          cd plc-dashboard
          export PYTHONPATH="${PWD}/backend:${PYTHONPATH}"
          cd backend
          # Phase 1認証対応: E2E用のadminユーザーと共有APIキーを既知の値で作成
          # （パスワードは scripts/test_monitoring_chart.py のログイン処理と一致させる）
          flask --app manage.py auth seed --admin-password plc-monitor-2025 --api-key plc-e2e-agent-key
        env:
          DATABASE_URL: postgresql+psycopg2://plc_user:plc_pass@localhost:5432/plc_monitor

      - name: Start backend server
        run: |
          cd plc-dashboard
          export PYTHONPATH="${PWD}/backend:${PYTHONPATH}"
          cd backend
          flask --app manage.py run --host=0.0.0.0 --port=5000 &
          # 設備登録より前にバックエンドの起動を保証する（レースで登録が接続拒否になるのを防ぐ）
          # Phase 1認証対応: /api/equipment は401を返すようになったため、無認証の /api/health で確認
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health >/dev/null 2>&1; then
              echo "backend ready"; break
            fi
            echo "waiting for backend... ($i)"; sleep 1
          done
        env:
          DATABASE_URL: postgresql+psycopg2://plc_user:plc_pass@localhost:5432/plc_monitor

      - name: Start frontend server
        run: |
          cd plc-dashboard
          npm run dev &
          sleep 10

      - name: Register equipment and start demo data sender
        run: |
          cd plc-dashboard
          export PYTHONPATH="${PWD}/backend:${PYTHONPATH}"
          cd backend
          # テストが参照する LINE_A_001 を登録（PLC設定含む）し、同一設備へ連続データを送信する。
          # continuousモードは内部で register_equipment()（PLC設定登録含む）→ 連続送信 を実行する。
          python demo_data_sender.py --mode continuous --equipment-id LINE_A_001 --interval 2.0 &
          sleep 5
        env:
          # Phase 1認証対応: seedステップで登録した共有APIキー
          AGENT_API_KEY: plc-e2e-agent-key

      - name: Run Playwright tests
        run: |
          cd plc-dashboard
          python scripts/test_monitoring_chart.py
        env:
          CI: true

      # 共通コンポーネントの描画健全性ガード（PR #43で修正したサイレント破損の再発防止）。
      # エラー・アラーム/インシデントの各タブとerrors-alarmsページが実際に描画され、
      # Failed to resolve component 警告が出ないことを検証する。
      - name: Run render health regression test
        run: |
          cd plc-dashboard
          python scripts/test_render_health.py
        env:
          CI: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: plc-dashboard/scripts/*.png
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            plc-dashboard/playwright-report/
            plc-dashboard/test-results/
          retention-days: 7
